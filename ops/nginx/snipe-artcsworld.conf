server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cloudflare-origin-artcsworld.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin-artcsworld.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 80;
    server_name artcsworld.xyz www.artcsworld.xyz api.artcsworld.xyz updates.artcsworld.xyz;

    client_max_body_size 2g;

    location ^~ /downloads/v2/ {
        alias /home/ubuntu/snipe/data/updates/downloads/v2/;
        autoindex off;
        disable_symlinks on;

        if ($uri ~ "(^|/)\.") {
            return 404;
        }

        limit_except GET {
            deny all;
        }

        types {
            application/json json;
            application/vnd.microsoft.portable-executable exe;
            application/x-msi msi;
            application/zip zip;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /cr-images/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        set $upstream_cr https://api-assets.clashroyale.com;
        rewrite ^/cr-images/(.*) /$1 break;
        proxy_pass $upstream_cr;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    location ~ ^/ws/?$ {
        rewrite ^/ws/?$ /ws break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /bans {
        return 301 https://bans.artcsworld.xyz/;
    }

    location = /bans/ {
        return 301 https://bans.artcsworld.xyz/;
    }

    location = /admin/assets/ban-wave-20260629.html {
        return 404;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $snipe_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin $snipe_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

